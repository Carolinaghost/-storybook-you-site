<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<title>Orders &middot; Crayonauts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Karla:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #FBF6EA; --card: #FFFFFF; --ink: #2A2724; --ink-soft: #6B6357;
    --blue: #2F5FA8; --blue-dark: #1F4479; --line: #DCD2B8; --danger: #C1432B;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font-family: 'Karla', sans-serif; line-height: 1.55;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 40px 24px 80px; }
  h1 { font-family: 'Baloo 2', sans-serif; margin: 0; font-size: 36px; color: var(--blue-dark); }
  header { text-align: center; margin-bottom: 30px; }
  .tagline { color: var(--ink-soft); font-size: 15px; margin-top: 6px; }

  .page {
    background: var(--card); border-radius: 18px; border: 2px dashed var(--line);
    padding: 26px; box-shadow: 0 6px 22px rgba(42, 39, 36, 0.06);
  }

  #adminLogin p { margin: 0 0 10px; color: var(--ink-soft); font-size: 14px; }
  .key-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .key-row input {
    flex: 1 1 220px; min-width: 0; padding: 10px 12px; font: inherit;
    border: 2px solid var(--line); border-radius: 10px; background: #fff; color: var(--ink);
  }
  .key-row input:focus { outline: none; border-color: var(--blue); }
  .key-row button {
    padding: 10px 20px; font: inherit; font-weight: 700; cursor: pointer;
    border: 0; border-radius: 10px; background: var(--blue); color: #fff;
  }
  .key-row button:hover { background: var(--blue-dark); }
  #adminLoginError { display: none; color: var(--danger); font-size: 14px; margin-top: 10px; }

  .order-row {
    border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px;
    margin-bottom: 10px; display: flex; gap: 12px; align-items: center;
  }
  .order-row img { width: 52px; height: 52px; object-fit: cover; border-radius: 8px; }
  .order-row .meta { font-size: 13px; }
  .order-row .meta b { font-family: 'Baloo 2', sans-serif; font-size: 14px; }
  .empty { color: var(--ink-soft); font-size: 14px; text-align: center; padding: 10px; }
  .badge-paid { background:#DFF3E4; color:#1F7A3D; border-radius:6px; padding:2px 8px; font-size:12px; font-weight:700; }
  .badge-unpaid { background:#F3F1E9; color:#6B6357; border-radius:6px; padding:2px 8px; font-size:12px; font-weight:700; }
  .del-btn { margin-left:auto; border:1px solid var(--danger); background:#fff; color:var(--danger);
             border-radius:8px; padding:6px 12px; font:inherit; font-size:13px; cursor:pointer; white-space:nowrap; }
  .del-btn.armed { background:var(--danger); color:#fff; }
  .del-btn:disabled { opacity:0.6; cursor:default; }

  #statsCard { display: none; }
  .stats-head { display:flex; align-items:baseline; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:14px; }
  .stats-head h2 { font-family:'Baloo 2', sans-serif; margin:0; font-size:22px; color:var(--blue-dark); }
  .range button {
    border:1px solid var(--line); background:#fff; color:var(--ink-soft);
    font:inherit; font-size:13px; padding:4px 10px; border-radius:999px; cursor:pointer; margin-left:6px;
  }
  .range button.on { background:var(--blue); border-color:var(--blue); color:#fff; }
  .funnel-row { display:grid; grid-template-columns: 150px 1fr 96px; align-items:center; gap:10px; margin-bottom:7px; font-size:13px; }
  .funnel-row .label { color:var(--ink-soft); }
  .funnel-row .bar { background:#F1EDE0; border-radius:999px; height:16px; overflow:hidden; }
  .funnel-row .bar span { display:block; height:100%; background:var(--blue); border-radius:999px; }
  .funnel-row .num { text-align:right; font-variant-numeric:tabular-nums; }
  .funnel-row .num b { font-family:'Baloo 2', sans-serif; }
  .funnel-row .num i { font-style:normal; color:var(--ink-soft); font-size:12px; margin-left:5px; }
  .drop { font-size:12px; color:var(--ink-soft); margin:10px 0 0; }
  table.sources { width:100%; border-collapse:collapse; margin-top:6px; font-size:13px; }
  table.sources th { text-align:left; color:var(--ink-soft); font-weight:normal; font-size:12px; padding:4px 6px; border-bottom:1px solid var(--line); }
  table.sources td { padding:5px 6px; border-bottom:1px solid #F1EDE0; font-variant-numeric:tabular-nums; }
  table.sources td:first-child { font-family:'Baloo 2', sans-serif; }
  table.sources td.n { text-align:right; }
  .sub { font-family:'Baloo 2', sans-serif; font-size:15px; margin:20px 0 2px; color:var(--ink); }
  .back { display:block; text-align:center; margin-top:24px; font-size:14px; color: var(--ink-soft); }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>Orders</h1>
    <div class="tagline">Crayonauts business view</div>
  </header>

  <div class="page" id="statsCard">
    <div class="stats-head">
      <h2>How the funnel is doing</h2>
      <div class="range">
        <button type="button" data-days="7" class="on">7 days</button>
        <button type="button" data-days="30">30 days</button>
        <button type="button" data-days="90">90 days</button>
      </div>
    </div>
    <div id="funnel"></div>
    <div class="sub">Where they came from</div>
    <div id="sources"></div>
  </div>

  <div class="page">
    <div id="adminLogin">
      <p>Enter your admin key to see orders.</p>
      <div class="key-row">
        <input type="password" id="adminKeyInput" placeholder="Admin key" autocomplete="current-password">
        <button type="button" id="adminUnlockBtn">Unlock</button>
      </div>
      <div id="adminLoginError"></div>
    </div>

    <div id="orderList"></div>
  </div>

  <a class="back" href="/">&larr; Back to the site</a>

</div>

<script>
const BACKEND_URL = 'https://api.crayonauts.com';


const adminLogin = document.getElementById('adminLogin');
const adminKeyInput = document.getElementById('adminKeyInput');
const adminUnlockBtn = document.getElementById('adminUnlockBtn');
const adminLoginError = document.getElementById('adminLoginError');

function unlockAdmin() {
  adminKey = adminKeyInput.value.trim();
  if (!adminKey) { adminKeyInput.focus(); return; }
  adminKeyInput.value = '';
  loadOrders();
}
adminUnlockBtn.addEventListener('click', unlockAdmin);
adminKeyInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') unlockAdmin(); });
let adminKey = '';

function formatUsd(cents) {
  return '$' + (cents / 100).toFixed(2);
}

// --- Funnel ---------------------------------------------------------------
const FUNNEL_LABELS = {
  landed: 'Visitors',
  uploaded: 'Uploaded a photo',
  preview_started: 'Asked for a preview',
  preview_shown: 'Got a preview',
  unlock_clicked: 'Clicked unlock',
  paid: 'Paid'
};
let statsDays = 7;

function pct(part, whole) {
  if (!whole) return '0%';
  return Math.round((part / whole) * 100) + '%';
}

async function loadStats() {
  if (!adminKey) return;
  const funnelEl = document.getElementById('sources');
  try {
    const url = BACKEND_URL + '/stats?days=' + statsDays + '&key=' + encodeURIComponent(adminKey);
    const r = await fetch(url);
    if (!r.ok) return;
    const data = await r.json();
    document.getElementById('statsCard').style.display = 'block';

    const steps = (data.funnel || []).filter((f) => FUNNEL_LABELS[f.type]);
    const top = steps.length ? steps[0].visitors : 0;
    document.getElementById('funnel').innerHTML = steps.map(function (f) {
      const width = top ? Math.max((f.visitors / top) * 100, f.visitors > 0 ? 2 : 0) : 0;
      const retry = f.hits > f.visitors ? ' title="' + f.hits + ' clicks in total, so some people tried more than once"' : '';
      return '<div class="funnel-row"' + retry + '>'
        + '<span class="label">' + FUNNEL_LABELS[f.type] + '</span>'
        + '<span class="bar"><span style="width:' + width + '%"></span></span>'
        + '<span class="num"><b>' + f.visitors + '</b><i>' + pct(f.visitors, top) + '</i></span>'
        + '</div>';
    }).join('');

    // The single most useful number: how many of the people who asked for a
    // preview never got one. That is drawing failures, not lost interest.
    const asked = (steps.find((f) => f.type === 'preview_started') || {}).visitors || 0;
    const got = (steps.find((f) => f.type === 'preview_shown') || {}).visitors || 0;
    const failed = Math.max(asked - got, 0);
    document.getElementById('funnel').insertAdjacentHTML('beforeend',
      '<p class="drop">' + (asked
        ? failed + ' of ' + asked + ' preview requests came back empty (' + pct(failed, asked) + ').'
        : 'No preview requests yet in this window.') + '</p>');

    const rows = data.sources || [];
    funnelEl.innerHTML = rows.length
      ? '<table class="sources"><tr><th>Source</th><th class="n" style="text-align:right">Visitors</th>'
        + '<th class="n" style="text-align:right">Paid</th><th class="n" style="text-align:right">Rate</th></tr>'
        + rows.map(function (x) {
            return '<tr><td>' + String(x.source || 'direct').replace(/[<>]/g, '') + '</td>'
              + '<td class="n">' + x.visitors + '</td>'
              + '<td class="n">' + x.paid + '</td>'
              + '<td class="n">' + pct(x.paid, x.visitors) + '</td></tr>';
          }).join('')
        + '</table>'
      : '<div class="empty">Nothing recorded yet.</div>';
  } catch (err) {
    /* stats are a nice-to-have; never let them break the orders view */
  }
}

document.querySelectorAll('.range button').forEach(function (b) {
  b.addEventListener('click', function () {
    document.querySelectorAll('.range button').forEach(function (x) { x.classList.remove('on'); });
    b.classList.add('on');
    statsDays = parseInt(b.dataset.days, 10) || 7;
    loadStats();
  });
});

async function loadOrders() {
  const listEl = document.getElementById('orderList');
  listEl.innerHTML = '<div class="empty">Loading...</div>';
  try {
    let url = BACKEND_URL + '/orders';
    if (adminKey) url += '?key=' + encodeURIComponent(adminKey);
    let response = await fetch(url);

    // A browser prompt() freezes the whole tab while it is open, so the key is
    // asked for with an ordinary field on the page instead.
    if (response.status === 401) {
      listEl.innerHTML = '';
      adminLogin.style.display = 'block';
      adminLoginError.style.display = adminKey ? 'block' : 'none';
      if (adminKey) adminLoginError.textContent = 'That key was not accepted.';
      adminKeyInput.focus();
      return;
    }
    adminLogin.style.display = 'none';
    adminLoginError.style.display = 'none';
    loadStats();

    const data = await response.json();
    const ordersList = (data && data.orders) || [];
    if (ordersList.length === 0) {
      listEl.innerHTML = '<div class="empty">No orders submitted yet.</div>';
      return;
    }
    listEl.innerHTML = '';
    ordersList.forEach(o => {
      const row = document.createElement('div');
      row.className = 'order-row';

      const money = o.amountCents ? ' ' + formatUsd(o.amountCents) : '';
      const paidBadge = o.paid
        ? '<span class="badge-paid">PAID' + money + '</span>'
        : '<span class="badge-unpaid">unpaid</span>';

      const meta = document.createElement('div');
      meta.className = 'meta';
      meta.innerHTML =
        '<b>#' + o.id + ' ' + o.childName + '</b> — ' + o.theme +
        (o.childCount > 1 ? ' (' + o.childCount + ' kids)' : '') + ' ' + paidBadge + '<br>' +
        o.email + '<br>' +
        (o.notes ? o.notes + '<br>' : '') +
        new Date(o.submittedAt).toLocaleString();

      // Two-step delete: the first click only arms it, and it disarms itself
      // after a few seconds. No browser dialog, and no single click destroys data.
      const del = document.createElement('button');
      del.className = 'del-btn';
      del.textContent = 'Delete';
      let armed = false;
      let armTimer = null;
      function disarm() {
        armed = false;
        del.textContent = 'Delete';
        del.classList.remove('armed');
      }
      del.addEventListener('click', async () => {
        if (!armed) {
          armed = true;
          del.textContent = o.paid ? 'Delete PAID order?' : 'Really delete?';
          del.classList.add('armed');
          armTimer = setTimeout(disarm, 4000);
          return;
        }
        clearTimeout(armTimer);
        del.disabled = true;
        del.textContent = 'Deleting...';
        try {
          let url = BACKEND_URL + '/orders/' + o.id + '?key=' + encodeURIComponent(adminKey);
          if (o.paid) url += '&force=1';
          const r = await fetch(url, { method: 'DELETE' });
          if (!r.ok) {
            const e = await r.json().catch(function () { return {}; });
            throw new Error(e.error || 'Delete failed.');
          }
          row.style.opacity = '0.4';
          del.textContent = 'Deleted';
          setTimeout(loadOrders, 600);
        } catch (err) {
          del.disabled = false;
          disarm();
          listEl.insertAdjacentHTML('afterbegin',
            '<div class="empty" style="color:#C1432B;">' + err.message + '</div>');
        }
      });

      if (o.thumb) {
        const img = document.createElement('img');
        img.src = o.thumb;
        img.alt = '';
        row.appendChild(img);
      }
      row.appendChild(meta);
      row.appendChild(del);
      listEl.appendChild(row);
    });
  } catch (err) {
    listEl.innerHTML = '<div class="empty">Couldn\'t load orders.</div>';
  }
}

// Ask on load; the key field stays put until the server accepts a key.
loadOrders();
</script>
</body>
</html>
