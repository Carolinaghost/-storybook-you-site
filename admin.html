<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<title>Orders &middot; Storybook You</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Karla:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #FBF6EA; --card: #FFFFFF; --ink: #2A2724; --ink-soft: #6B6357;
    --blue: #2F5FA8; --blue-dark: #1F4479; --line: #DCD2B8; --danger: #C1432B;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font-family: 'Karla', sans-serif; line-height: 1.55;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 40px 24px 80px; }
  h1 { font-family: 'Baloo 2', sans-serif; margin: 0; font-size: 36px; color: var(--blue-dark); }
  header { text-align: center; margin-bottom: 30px; }
  .tagline { color: var(--ink-soft); font-size: 15px; margin-top: 6px; }

  .page {
    background: var(--card); border-radius: 18px; border: 2px dashed var(--line);
    padding: 26px; box-shadow: 0 6px 22px rgba(42, 39, 36, 0.06);
  }

  #adminLogin p { margin: 0 0 10px; color: var(--ink-soft); font-size: 14px; }
  .key-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .key-row input {
    flex: 1 1 220px; min-width: 0; padding: 10px 12px; font: inherit;
    border: 2px solid var(--line); border-radius: 10px; background: #fff; color: var(--ink);
  }
  .key-row input:focus { outline: none; border-color: var(--blue); }
  .key-row button {
    padding: 10px 20px; font: inherit; font-weight: 700; cursor: pointer;
    border: 0; border-radius: 10px; background: var(--blue); color: #fff;
  }
  .key-row button:hover { background: var(--blue-dark); }
  #adminLoginError { display: none; color: var(--danger); font-size: 14px; margin-top: 10px; }

  .order-row {
    border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px;
    margin-bottom: 10px; display: flex; gap: 12px; align-items: center;
  }
  .order-row img { width: 52px; height: 52px; object-fit: cover; border-radius: 8px; }
  .order-row .meta { font-size: 13px; }
  .order-row .meta b { font-family: 'Baloo 2', sans-serif; font-size: 14px; }
  .empty { color: var(--ink-soft); font-size: 14px; text-align: center; padding: 10px; }
  .badge-paid { background:#DFF3E4; color:#1F7A3D; border-radius:6px; padding:2px 8px; font-size:12px; font-weight:700; }
  .badge-unpaid { background:#F3F1E9; color:#6B6357; border-radius:6px; padding:2px 8px; font-size:12px; font-weight:700; }
  .del-btn { margin-left:auto; border:1px solid var(--danger); background:#fff; color:var(--danger);
             border-radius:8px; padding:6px 12px; font:inherit; font-size:13px; cursor:pointer; white-space:nowrap; }
  .del-btn.armed { background:var(--danger); color:#fff; }
  .del-btn:disabled { opacity:0.6; cursor:default; }

  .back { display:block; text-align:center; margin-top:24px; font-size:14px; color: var(--ink-soft); }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>Orders</h1>
    <div class="tagline">Storybook You business view</div>
  </header>

  <div class="page">
    <div id="adminLogin">
      <p>Enter your admin key to see orders.</p>
      <div class="key-row">
        <input type="password" id="adminKeyInput" placeholder="Admin key" autocomplete="current-password">
        <button type="button" id="adminUnlockBtn">Unlock</button>
      </div>
      <div id="adminLoginError"></div>
    </div>

    <div id="orderList"></div>
  </div>

  <a class="back" href="/">&larr; Back to the site</a>

</div>

<script>
const BACKEND_URL = 'https://api.storybookyou.art';


const adminLogin = document.getElementById('adminLogin');
const adminKeyInput = document.getElementById('adminKeyInput');
const adminUnlockBtn = document.getElementById('adminUnlockBtn');
const adminLoginError = document.getElementById('adminLoginError');

function unlockAdmin() {
  adminKey = adminKeyInput.value.trim();
  if (!adminKey) { adminKeyInput.focus(); return; }
  adminKeyInput.value = '';
  loadOrders();
}
adminUnlockBtn.addEventListener('click', unlockAdmin);
adminKeyInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') unlockAdmin(); });
let adminKey = '';

function formatUsd(cents) {
  return '$' + (cents / 100).toFixed(2);
}

async function loadOrders() {
  const listEl = document.getElementById('orderList');
  listEl.innerHTML = '<div class="empty">Loading...</div>';
  try {
    let url = BACKEND_URL + '/orders';
    if (adminKey) url += '?key=' + encodeURIComponent(adminKey);
    let response = await fetch(url);

    // A browser prompt() freezes the whole tab while it is open, so the key is
    // asked for with an ordinary field on the page instead.
    if (response.status === 401) {
      listEl.innerHTML = '';
      adminLogin.style.display = 'block';
      adminLoginError.style.display = adminKey ? 'block' : 'none';
      if (adminKey) adminLoginError.textContent = 'That key was not accepted.';
      adminKeyInput.focus();
      return;
    }
    adminLogin.style.display = 'none';
    adminLoginError.style.display = 'none';

    const data = await response.json();
    const ordersList = (data && data.orders) || [];
    if (ordersList.length === 0) {
      listEl.innerHTML = '<div class="empty">No orders submitted yet.</div>';
      return;
    }
    listEl.innerHTML = '';
    ordersList.forEach(o => {
      const row = document.createElement('div');
      row.className = 'order-row';

      const money = o.amountCents ? ' ' + formatUsd(o.amountCents) : '';
      const paidBadge = o.paid
        ? '<span class="badge-paid">PAID' + money + '</span>'
        : '<span class="badge-unpaid">unpaid</span>';

      const meta = document.createElement('div');
      meta.className = 'meta';
      meta.innerHTML =
        '<b>#' + o.id + ' ' + o.childName + '</b> — ' + o.theme +
        (o.childCount > 1 ? ' (' + o.childCount + ' kids)' : '') + ' ' + paidBadge + '<br>' +
        o.email + '<br>' +
        (o.notes ? o.notes + '<br>' : '') +
        new Date(o.submittedAt).toLocaleString();

      // Two-step delete: the first click only arms it, and it disarms itself
      // after a few seconds. No browser dialog, and no single click destroys data.
      const del = document.createElement('button');
      del.className = 'del-btn';
      del.textContent = 'Delete';
      let armed = false;
      let armTimer = null;
      function disarm() {
        armed = false;
        del.textContent = 'Delete';
        del.classList.remove('armed');
      }
      del.addEventListener('click', async () => {
        if (!armed) {
          armed = true;
          del.textContent = o.paid ? 'Delete PAID order?' : 'Really delete?';
          del.classList.add('armed');
          armTimer = setTimeout(disarm, 4000);
          return;
        }
        clearTimeout(armTimer);
        del.disabled = true;
        del.textContent = 'Deleting...';
        try {
          let url = BACKEND_URL + '/orders/' + o.id + '?key=' + encodeURIComponent(adminKey);
          if (o.paid) url += '&force=1';
          const r = await fetch(url, { method: 'DELETE' });
          if (!r.ok) {
            const e = await r.json().catch(function () { return {}; });
            throw new Error(e.error || 'Delete failed.');
          }
          row.style.opacity = '0.4';
          del.textContent = 'Deleted';
          setTimeout(loadOrders, 600);
        } catch (err) {
          del.disabled = false;
          disarm();
          listEl.insertAdjacentHTML('afterbegin',
            '<div class="empty" style="color:#C1432B;">' + err.message + '</div>');
        }
      });

      if (o.thumb) {
        const img = document.createElement('img');
        img.src = o.thumb;
        img.alt = '';
        row.appendChild(img);
      }
      row.appendChild(meta);
      row.appendChild(del);
      listEl.appendChild(row);
    });
  } catch (err) {
    listEl.innerHTML = '<div class="empty">Couldn\'t load orders.</div>';
  }
}

// Ask on load; the key field stays put until the server accepts a key.
loadOrders();
</script>
</body>
</html>
